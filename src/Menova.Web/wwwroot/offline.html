<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Menova POS - Sem Ligação</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #fdfaf6; color: #2b2b2b; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; text-align: center; }
        .card { background: #ffffff; border: 1px solid #e5ded6; border-radius: 16px; padding: 32px 24px; max-width: 380px; width: 100%; box-shadow: 0 4px 20px rgba(110, 26, 51, 0.08); }
        .logo { width: 72px; height: 72px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 4px 12px rgba(110, 26, 51, 0.2); }
        h1 { font-size: 1.25rem; font-weight: 700; color: #6E1A33; margin-bottom: 12px; }
        p { font-size: 0.9rem; color: #666; line-height: 1.5; margin-bottom: 24px; }
        .btn { display: block; width: 100%; background: #6E1A33; color: #ffffff; text-decoration: none; padding: 14px 20px; border-radius: 10px; font-weight: 600; font-size: 0.95rem; border: none; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #521326; }
        .hint { font-size: 0.75rem; color: #999; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="card">
        <img src="/icons/icon-192.png" alt="Menova" class="logo" />
        <h1>Sem Ligação à Rede Local</h1>
        <p>Não foi possível contactar o servidor do restaurante. Verifique se o telemóvel está ligado ao Wi-Fi interno do estabelecimento.</p>
        <button class="btn" onclick="window.location.reload()">Tentar Reconectar</button>
        <div class="hint">Menova POS &middot; Moçambique (Africa/Maputo)</div>
    </div>
</body>
</html>
